name: FitPlan 1.9.13 full catalog RC

on:
  push:
    paths:
      - "fitplan/native/**"
      - "fitplan/stabilize_v1911.py"
      - "fitplan/plate45_calibration_patch.py"
      - "fitplan/precision_v6_catalog_patch.py"
      - ".github/workflows/fitplan-native-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare app assets and back handling
        run: |
          set -euo pipefail
          mkdir -p fitplan/tmp_extract
          python -m zipfile -e fitplan/source.zip fitplan/tmp_extract
          python - <<'PY'
          from pathlib import Path
          src=Path('fitplan/tmp_extract')
          assets=src/'assets'
          assert assets.is_dir(), f'Source ZIP must have assets/ at root: {list(src.iterdir())}'
          dst=Path('fitplan/native/app/src/main/assets')
          dst.mkdir(parents=True,exist_ok=True)
          for file in assets.iterdir():
            if file.is_file():
              (dst/file.name).write_bytes(file.read_bytes())
          PY
          mkdir -p fitplan/app/assets
          cp fitplan/native/app/src/main/assets/app.js fitplan/app/assets/app.js
          python fitplan/patch_android_back.py
          cp fitplan/app/assets/app.js fitplan/native/app/src/main/assets/app.js
      - name: Stabilize app JS and verify syntax
        env:
          FITPLAN_BUILD_VERSION: "1.9.13"
        run: |
          set -euo pipefail
          python fitplan/stabilize_v1911.py
          node --check fitplan/native/app/src/main/assets/app.js
          python - <<'PY'
          from pathlib import Path
          s=Path('fitplan/native/app/src/main/assets/app.js').read_text()
          assert "const APP_VERSION=(()=>{" in s and "getAppVersion" in s and "nativeVersion" in s
          assert "function nativeSync()" in s
          assert "window.FitPlanNative.loadSnapshot()" in s
          assert "function fitplanBack()" in s
          assert "window.FitPlanNative?.clearSnapshot()" in s
          assert s.index("let lastSafeSnapshot=0,lastNativeSchedule=''") < s.index("let state=load();")
          print('Stable app smoke tests passed')
          PY
      - name: Apply 45 degree plate-loaded leg press calibration
        run: |
          set -euo pipefail
          python fitplan/plate45_calibration_patch.py
          node --check fitplan/native/app/src/main/assets/app.js
          node --check fitplan/native/app/src/main/assets/precision-engine-v5.js
          node - <<'JS'
          const v5=require('./fitplan/native/app/src/main/assets/precision-engine-v5.js');
          const e={id:'leg_press',gear:'machine',kind:'compound',pattern:'squat'};
          const a=v5.startingLoad({weight:96,level:2},e,10,10);
          if(a.source!=='plate45'||a.weight!==20||a.step!==10)throw Error('Invalid plate45 starting trial');
          const c=v5.begin({weight:96,level:2},e,'plate45_v1',10,10);
          if(c.phase!=='sledcheck')throw Error('Missing empty-sled safety check');
          const easy=v5.evaluateTrial(c,{weight:20,reps:8,rir:10,form:'good',pain:false});
          if(easy.weight<=20||easy.weight>40)throw Error('Incorrect exploratory progression');
          const done=v5.evaluateTrial({...c,phase:'instructions'},{weight:40,reps:8,rir:3,form:'good',pain:false});
          if(done.status!=='ready'||done.weight!==40)throw Error('Cannot calibrate');
          const stop=v5.evaluateTrial(c,{weight:20,reps:3,rir:0,form:'poor',pain:false});
          if(stop.status!=='stopped')throw Error('Poor form must stop trials');
          console.log('Plate45 calibration safety and RIR tests passed');
          JS
      - name: Apply 31 exercise reference policies
        run: |
          python fitplan/precision_v6_catalog_patch.py
          node --check fitplan/native/app/src/main/assets/precision-engine-v5.js
          node --check fitplan/native/app/src/main/assets/app.js
          node -e "const v=require('./fitplan/native/app/src/main/assets/precision-engine-v5.js');if(Object.keys(v.CATALOG_V6).length!==31)process.exit(1);const e={id:'leg_press',gear:'machine',kind:'compound',pattern:'squat'};const p={sex:'male',weight:96,level:0};const w=v.startingLoad(p,e,10,10);if(w.weight<40||w.weight>80||v.begin(p,e,'plate45_v1',10,10).phase!=='sledcheck')process.exit(2);console.log('31 exercises and 45-degree leg press checked');"
      - name: Apply version code 69 to native project
        run: |
          sed -i "s/versionCode 65/versionCode 69/; s/versionName '1.9.10'/versionName '1.9.13'/" fitplan/native/app/build.gradle
      - name: Build compiled Android Activity APK
        working-directory: fitplan/native
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signing secrets and sign APK
        env:
          KEY_B64: ${{ secrets.FITPLAN_SIGNING_KEY_PEM_B64 }}
          CERT_B64: ${{ secrets.FITPLAN_SIGNING_CERT_DER_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$CERT_B64"
          mkdir -p /tmp/fitplan
          printf '%s' "$KEY_B64" | base64 -d > /tmp/fitplan/key.pem
          printf '%s' "$CERT_B64" | base64 -d > /tmp/fitplan/cert.der
          chmod 600 /tmp/fitplan/key.pem
          openssl x509 -inform der -in /tmp/fitplan/cert.der -out /tmp/fitplan/cert.pem
          digest=$(openssl x509 -in /tmp/fitplan/cert.pem -outform der | sha256sum | cut -d' ' -f1)
          test "$digest" = "2de78f098f47c444b4ef054be6dfbcbab49a374a3a30937ead5d9d73f5d6e99c"
          openssl pkcs12 -export -inkey /tmp/fitplan/key.pem -in /tmp/fitplan/cert.pem -name fitplan -out /tmp/fitplan/signing.p12 -passout pass:temporaryFitplanBuildPass
          APK=fitplan/native/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" /tmp/fitplan/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/fitplan/signing.p12 --ks-type PKCS12 --ks-key-alias fitplan --ks-pass pass:temporaryFitplanBuildPass --key-pass pass:temporaryFitplanBuildPass --out FitPlan-1.9.13-rc1.apk /tmp/fitplan/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs FitPlan-1.9.13-rc1.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging FitPlan-1.9.13-rc1.apk | head -8
          rm -f /tmp/fitplan/key.pem /tmp/fitplan/cert.der /tmp/fitplan/cert.pem /tmp/fitplan/signing.p12
      - name: Publish isolated test release (DO NOT update latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view fitplan-v1.9.13-rc1 >/dev/null 2>&1; then
            echo "Existing RC release. Refusing overwrite."
            exit 1
          fi
          gh release create fitplan-v1.9.13-rc1 FitPlan-1.9.13-rc1.apk --prerelease --title "FitPlan 1.9.13 RC1 - stabilization test" --notes "Plate-loaded 45-degree leg press separate sled resistance, per-side plate sum and supervised RIR calibration. Existing latest.json remains unchanged."
