name: FitPlan Android release

on:
  push:
    paths:
      - "fitplan/native/**"
      - "fitplan/source.zip"
      - "fitplan/version.json"
      - "fitplan/patch_android_back.py"
      - "fitplan/precision_v6_catalog_patch.py"
      - "fitplan/plate45_calibration_patch.py"
      - "fitplan/stabilize_v1911.py"
      - "fitplan/precision-engine-v7.js"
      - "fitplan/apply_v7.py"
      - "fitplan/apply_v75.py"
      - "fitplan/precision-engine-v75.js"
      - "fitplan/neon-v76.css"
      - "fitplan/apply_ui_v76.py"
      - "fitplan/test-v7.cjs"
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: fitplan-native-release
  cancel-in-progress: false

jobs:
  native-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json;print(json.load(open('fitplan/version.json'))['version'])")
          if gh release view "fitplan-v$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        if: steps.existing.outputs.skip != 'true'
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare app assets and back handling
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p fitplan/tmp_extract
          python -m zipfile -e fitplan/source.zip fitplan/tmp_extract
          python - <<'PY'
          from pathlib import Path
          src=Path('fitplan/tmp_extract')
          assets=src/'assets'
          assert assets.is_dir(), f'Source ZIP must have assets/ at root: {list(src.iterdir())}'
          dst=Path('fitplan/native/app/src/main/assets')
          dst.mkdir(parents=True,exist_ok=True)
          for file in assets.iterdir():
            if file.is_file():
              (dst/file.name).write_bytes(file.read_bytes())
          PY
          mkdir -p fitplan/app/assets
          cp fitplan/native/app/src/main/assets/app.js fitplan/app/assets/app.js
          python fitplan/patch_android_back.py
          cp fitplan/app/assets/app.js fitplan/native/app/src/main/assets/app.js
      - name: Apply full first-load catalog and regression checks
        if: steps.existing.outputs.skip != 'true'
        env:
          FITPLAN_BUILD_VERSION: ${{ steps.existing.outputs.version }}
        run: |
          set -euo pipefail
          python fitplan/stabilize_v1911.py
          python fitplan/plate45_calibration_patch.py
          python fitplan/precision_v6_catalog_patch.py
          node --check fitplan/native/app/src/main/assets/precision-engine-v5.js
          node --check fitplan/native/app/src/main/assets/app.js
          node -e "const v=require('./fitplan/native/app/src/main/assets/precision-engine-v5.js');if(Object.keys(v.CATALOG_V6).length!==31)throw Error('Missing exercise standards');"
      - name: Integrate Adaptive Coach V7.4 and verify compatibility
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cp fitplan/precision-engine-v7.js fitplan/native/app/src/main/assets/precision-engine-v7.js
          python fitplan/apply_v7.py
          node --check fitplan/native/app/src/main/assets/precision-engine-v7.js
          node --check fitplan/native/app/src/main/assets/app.js
          node fitplan/test-v7.cjs
          python - <<'PY'
          from pathlib import Path
          b=Path('fitplan/native/app/src/main/assets')
          h=(b/'index.html').read_text()
          j=(b/'app.js').read_text()
          assert h.index('precision-engine-v4.js')<h.index('precision-engine-v7.js')<h.index('app.js')
          assert "catch(error){console.warn('V7 fallback to V4',error)" in j
          assert "if(s.v7){const v=s.v7;s.v7={changes:" in j
          print('V7.4 production bundle checks passed')
          PY
      - name: Integrate V7.5 adaptive feedback and FitPlan icon
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python fitplan/apply_v75.py
          node --check fitplan/native/app/src/main/assets/precision-engine-v75.js
          node --check fitplan/native/app/src/main/assets/app.js
          python - <<'PY'
          from pathlib import Path
          b=Path('fitplan/native/app/src/main/assets')
          h=(b/'index.html').read_text()
          assert h.index('precision-engine-v7.js') < h.index('precision-engine-v75.js') < h.index('app.js')
          assert 'FitPlanPrecisionV75?.planDay(plannerInput)' in (b/'app.js').read_text()
          assert Path('fitplan/native/app/src/main/res/drawable/fitplan_icon.png').is_file()
          print('V7.5 native integration checks passed')
          PY
      - name: Apply V7.6 visual UI
        if: steps.existing.outputs.skip != 'true'
        run: |
          python fitplan/apply_ui_v76.py
          node --check fitplan/native/app/src/main/assets/app.js
      - name: Set native version from version.json
        if: steps.existing.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          v=json.loads(Path('fitplan/version.json').read_text())
          assert re.fullmatch(r'\d+\.\d+\.\d+',v['version'])
          assert isinstance(v['version_code'],int) and v['version_code'] >= 65
          p=Path('fitplan/native/app/build.gradle')
          s=p.read_text()
          s,n=re.subn(r'versionCode\s+\d+',f"versionCode {v['version_code']}",s,count=1)
          assert n==1
          s,n=re.subn(r"versionName\s+'[^']+'",f"versionName '{v['version']}'",s,count=1)
          assert n==1
          p.write_text(s)
          PY
      - name: Build compiled Android Activity APK
        if: steps.existing.outputs.skip != 'true'
        working-directory: fitplan/native
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signing secrets and sign APK
        if: steps.existing.outputs.skip != 'true'
        env:
          KEY_B64: ${{ secrets.FITPLAN_SIGNING_KEY_PEM_B64 }}
          CERT_B64: ${{ secrets.FITPLAN_SIGNING_CERT_DER_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$CERT_B64"
          mkdir -p /tmp/fitplan
          printf '%s' "$KEY_B64" | base64 -d > /tmp/fitplan/key.pem
          printf '%s' "$CERT_B64" | base64 -d > /tmp/fitplan/cert.der
          chmod 600 /tmp/fitplan/key.pem
          openssl x509 -inform der -in /tmp/fitplan/cert.der -out /tmp/fitplan/cert.pem
          digest=$(openssl x509 -in /tmp/fitplan/cert.pem -outform der | sha256sum | cut -d' ' -f1)
          test "$digest" = "2de78f098f47c444b4ef054be6dfbcbab49a374a3a30937ead5d9d73f5d6e99c"
          openssl pkcs12 -export -inkey /tmp/fitplan/key.pem -in /tmp/fitplan/cert.pem -name fitplan -out /tmp/fitplan/signing.p12 -passout pass:temporaryFitplanBuildPass
          APK=fitplan/native/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" /tmp/fitplan/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/fitplan/signing.p12 --ks-type PKCS12 --ks-key-alias fitplan --ks-pass pass:temporaryFitplanBuildPass --key-pass pass:temporaryFitplanBuildPass --out FitPlan-release.apk /tmp/fitplan/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs FitPlan-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging FitPlan-release.apk | head -8
          rm -f /tmp/fitplan/key.pem /tmp/fitplan/cert.der /tmp/fitplan/cert.pem /tmp/fitplan/signing.p12
      - name: Publish release and update latest
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python -c "import json;print(json.load(open('fitplan/version.json'))['version'])")
          TAG="fitplan-v$VERSION"
          test ! -z "$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Already released: $TAG"
            exit 0
          fi
          cp FitPlan-release.apk "FitPlan-$VERSION.apk"
          gh release create "$TAG" "FitPlan-$VERSION.apk" --title "FitPlan $VERSION" --notes "Official FitPlan Android release - native compiled Activity and WebView."
          python - <<'PY'
          from pathlib import Path
          import json
          v=json.loads(Path('fitplan/version.json').read_text())['version']
          u=f'https://github.com/ffast112-ff/cam112/releases/download/fitplan-v{v}/FitPlan-{v}.apk'
          Path('fitplan/latest.json').write_text(json.dumps({'version':v,'apk_url':u,'notes':f'FitPlan {v} 업데이트'},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fitplan/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "release(fitplan): latest $VERSION"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
