name: FitPlan Android release

on:
  push:
    paths:
      - "fitplan/app/**"
      - "fitplan/source.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fitplan-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependency
        run: python -m pip install 'cryptography>=43,<48'
      - name: Restore initial FitPlan source archive
        run: |
          if [ ! -f fitplan/app/build_apk.py ] && [ -f fitplan/source.zip ]; then
            mkdir -p fitplan/app
            python -m zipfile -e fitplan/source.zip fitplan/app
          fi
      - name: Apply Android system back navigation patch
        run: python fitplan/patch_android_back.py
      - name: Verify source and signing secrets
        env:
          SIGNING_KEY: ${{ secrets.FITPLAN_SIGNING_KEY_PEM_B64 }}
          SIGNING_CERT: ${{ secrets.FITPLAN_SIGNING_CERT_DER_B64 }}
        run: |
          set -euo pipefail
          test -f fitplan/app/build_apk.py || { echo 'FitPlan app source has not been uploaded'; exit 1; }
          test -n "$SIGNING_KEY" && test -n "$SIGNING_CERT" || { echo 'Missing FitPlan signing secrets'; exit 1; }
          mkdir -p /tmp/fitplan-signing
          printf '%s' "$SIGNING_KEY" | base64 -d > /tmp/fitplan-signing/key.pem
          printf '%s' "$SIGNING_CERT" | base64 -d > /tmp/fitplan-signing/cert.der
          chmod 600 /tmp/fitplan-signing/key.pem
      - name: Verify signature identity and build APK
        id: build
        env:
          FITPLAN_OUTPUT: ${{ runner.temp }}/FitPlan-release.apk
        run: |
          python - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          root=Path('fitplan/app')
          key=serialization.load_pem_private_key(Path('/tmp/fitplan-signing/key.pem').read_bytes(),password=None)
          cert=x509.load_der_x509_certificate(Path('/tmp/fitplan-signing/cert.der').read_bytes())
          expected='2de78f098f47c444b4ef054be6dfbcbab49a374a3a30937ead5d9d73f5d6e99c'
          actual=cert.fingerprint(hashes.SHA256()).hex()
          assert actual==expected, 'This key is NOT the signing identity used by FitPlan 1.9.7; aborting'
          assert key.public_key().public_numbers()==cert.public_key().public_numbers(), 'Certificate and key mismatch'
          v=json.loads(Path('fitplan/version.json').read_text())
          version=str(v['version'])
          code=int(v['version_code'])
          assert code>62 and re.fullmatch(r'\d+\.\d+\.\d+',version)
          source=(root/'build_apk.py').read_text()
          def repl(pattern,value):
              global source
              source,n=re.subn(pattern,lambda m:value,source,count=1)
              assert n==1, 'Builder format changed: '+pattern
          repl(r"OUT=Path\([^\n]+\)","OUT=Path(os.environ['FITPLAN_OUTPUT'])")
          repl(r"APP='[^']+'","APP='com.fitplan.autocv196'")
          repl(r"\(ANDROID,'versionCode',\d+,'int'\)",f"(ANDROID,'versionCode',{code},'int')")
          repl(r"\(ANDROID,'versionName','[^']+','str'\)",f"(ANDROID,'versionName','{version}','str')")
          repl(r"after=b'Lcom/fitplan/[^']+/MainActivity;'","after=b'Lcom/fitplan/autocv193/MainActivity;'")
          (root/'build_apk.py').write_text(source)
          shutil.copy('/tmp/fitplan-signing/key.pem',root/'fitplan_signing_private_key.pem')
          shutil.copy('/tmp/fitplan-signing/cert.der',root/'fitplan_signing_certificate.der')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'version={version}\n')
              out.write(f'apk=FitPlan-{version}.apk\n')
          PY
          python fitplan/app/build_apk.py
          test -s "$FITPLAN_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          apk=Path(os.environ['FITPLAN_OUTPUT'])
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert {'AndroidManifest.xml','classes.dex','resources.arsc'}<=set(z.namelist())
          print('APK file verified:',apk.stat().st_size,'bytes')
          PY
          rm -f fitplan/app/fitplan_signing_private_key.pem fitplan/app/fitplan_signing_certificate.der
      - name: Publish FitPlan release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          APK_NAME: ${{ steps.build.outputs.apk }}
          FITPLAN_OUTPUT: ${{ runner.temp }}/FitPlan-release.apk
        run: |
          set -euo pipefail
          tag="fitplan-v$VERSION"
          cp "$FITPLAN_OUTPUT" "$APK_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag (refusing to overwrite)"
            exit 1
          fi
          gh release create "$tag" "$APK_NAME" --title "FitPlan $VERSION" --notes "FitPlan Android update $VERSION"
      - name: Update application version manifest
        env:
          VERSION: ${{ steps.build.outputs.version }}
          APK_NAME: ${{ steps.build.outputs.apk }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          v=os.environ['VERSION'];apk=os.environ['APK_NAME']
          url=f'https://github.com/ffast112-ff/cam112/releases/download/fitplan-v{v}/{apk}'
          Path('fitplan/latest.json').write_text(json.dumps({'version':v,'apk_url':url,'notes':f'FitPlan {v} 업데이트'},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fitplan/latest.json
          git commit -m "release(fitplan): update latest to $VERSION"
          git push
